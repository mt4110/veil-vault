name = "veil-vault"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-05"
# Keep public routes disabled until deployment has been reviewed.
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "veil-vault"
# Placeholder for local development. Replace with the ID of an approved remote DB.
database_id = "00000000-0000-0000-0000-000000000000"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = false
