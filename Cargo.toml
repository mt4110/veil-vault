[package]
name = "veil-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "An at-most-once ciphertext broker for Cloudflare Workers and D1"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "=0.8.7", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "js"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
subtle = { version = "=2.6.1", default-features = false }

[profile.release]
lto = true
# Preserve symbols needed by wasm-bindgen's externref catch wrappers.
strip = "debuginfo"
codegen-units = 1
opt-level = "s"
