name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Rust checks
        run: |
          cargo fmt --check
          cargo check --locked --target wasm32-unknown-unknown
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Install locked local tooling
        run: |
          npm ci
          npm audit --audit-level=high
          cargo install worker-build --version 0.8.7 --locked --root target/tools
          cargo install cargo-audit --version 0.22.2 --locked --root target/tools
          echo "$PWD/target/tools/bin" >> "$GITHUB_PATH"
      - name: Audit Rust dependencies
        run: cargo audit --deny warnings
      - name: Build Wasm and test local D1
        run: |
          worker-build --release
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm run test:local
